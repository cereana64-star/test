name: Finalize 업무터치 single-file deployment

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-finalize
  cancel-in-progress: true

jobs:
  deploy-and-clean:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build standalone index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path('index.html').read_text(encoding='utf-8')
          css = Path('styles.css').read_text(encoding='utf-8')
          scripts = []
          for name in [
              'app-config.js',
              'template.js',
              'app-core-1.js',
              'app-core-2.js',
              'xlsx.js',
              'import.js',
              'bootstrap.js',
          ]:
              scripts.append(Path(name).read_text(encoding='utf-8'))

          html = html.replace(
              '<link rel="stylesheet" href="styles.css" />',
              '<style>\n' + css + '\n</style>'
          )

          first = '<script src="app-config.js"></script>'
          last = '<script src="bootstrap.js"></script>'
          start = html.index(first)
          end = html.index(last) + len(last)
          inline_script = '<script>\n(() => {\n' + '\n'.join(scripts) + '\n})();\n</script>'
          html = html[:start] + inline_script + html[end:]

          if '<script src=' in html or 'rel="stylesheet"' in html:
              raise SystemExit('외부 CSS/JS 참조가 남아 있습니다.')

          Path('index.html').write_text(html, encoding='utf-8')
          out = Path('_site')
          out.mkdir(exist_ok=True)
          (out / 'index.html').write_text(html, encoding='utf-8')
          print(f'Built standalone index.html: {len(html):,} chars')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload single-file site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Leave only index.html in repository
        shell: bash
        run: |
          rm -rf _site
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'index.html' -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to clean"
          else
            git commit -m "Keep only standalone index.html"
            git push origin HEAD:main
          fi
