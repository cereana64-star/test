<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>업무터치 v1.2 · 업무 인수인계 관리</title>
<meta name="description" content="브라우저에서 독립 실행되는 업무 인수인계 관리 웹앱 · v1.2" />
<style>
:root{
  --bg:#f4f6f9;--surface:#ffffff;--surface-2:#f8fafc;--text:#172033;--muted:#68738a;
  --line:#e4e8ef;--line-strong:#d8dee8;--primary:#3859d9;--primary-2:#2747c5;--primary-soft:#edf1ff;
  --success:#14825c;--success-soft:#e8f7f0;--warning:#ad6b00;--warning-soft:#fff5df;--danger:#c93f4c;--danger-soft:#ffedf0;
  --shadow:0 14px 40px rgba(25,37,66,.08);--shadow-sm:0 5px 18px rgba(25,37,66,.06);--radius:18px;--radius-sm:12px;
}
html[data-theme="dark"]{
  --bg:#11141b;--surface:#191e28;--surface-2:#202633;--text:#f0f3f8;--muted:#a4aec0;--line:#2b3342;--line-strong:#374153;
  --primary:#6f8cff;--primary-2:#8fa4ff;--primary-soft:#232c50;--success:#5fd0a4;--success-soft:#173b31;
  --warning:#f4bb5f;--warning-soft:#3a2c16;--danger:#ff7f8a;--danger-soft:#3d2026;--shadow:0 16px 44px rgba(0,0,0,.22);--shadow-sm:0 6px 20px rgba(0,0,0,.18);
}
*{box-sizing:border-box} html{font-family:Inter,Pretendard,"Noto Sans KR",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% -10%,rgba(56,89,217,.12),transparent 26%),var(--bg)}
button,input,select,textarea{font:inherit} button{cursor:pointer}
.app{max-width:1500px;margin:0 auto;padding:28px clamp(16px,3vw,38px) 48px}
.header{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:13px}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#4868e8,#233fba);display:grid;place-items:center;color:white;font-weight:800;box-shadow:0 10px 24px rgba(56,89,217,.26)}
.brand h1{margin:0;font-size:23px;letter-spacing:-.03em}.brand p{margin:3px 0 0;color:var(--muted);font-size:13px}
.header-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:11px;padding:10px 13px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;box-shadow:var(--shadow-sm);transition:.18s ease}
.btn:hover{transform:translateY(-1px);border-color:var(--line-strong)} .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary-2)}
.btn.ghost{box-shadow:none;background:transparent}.btn.danger{color:var(--danger);background:var(--danger-soft);border-color:transparent}.btn.small{padding:7px 10px;min-height:34px;font-size:12px}
.grid-cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:13px;margin-bottom:18px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm);min-height:110px;position:relative;overflow:hidden}
.metric::after{content:"";position:absolute;width:78px;height:78px;border-radius:50%;right:-24px;top:-24px;background:var(--primary-soft)}
.metric .label{font-size:12px;color:var(--muted);font-weight:700}.metric .value{font-size:30px;font-weight:850;letter-spacing:-.04em;margin-top:10px}.metric .hint{font-size:11px;color:var(--muted);margin-top:4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.toolbar{display:grid;grid-template-columns:minmax(220px,1.4fr) repeat(5,minmax(120px,.6fr)) auto;gap:10px;padding:16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--surface),var(--surface-2))}
.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;font-weight:750;color:var(--muted)}
.control{width:100%;border:1px solid var(--line-strong);background:var(--surface);color:var(--text);border-radius:11px;padding:10px 12px;outline:none;min-height:42px}.control:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(56,89,217,.12)}
.search-wrap{position:relative}.search-wrap .control{padding-left:38px}.search-icon{position:absolute;left:13px;top:12px;color:var(--muted);font-size:14px}
.table-wrap{overflow:auto;max-height:calc(100vh - 330px);min-height:330px}table{width:100%;border-collapse:separate;border-spacing:0;min-width:1050px}
th,td{padding:13px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}th{position:sticky;top:0;background:var(--surface-2);z-index:2;color:var(--muted);font-size:11px;letter-spacing:.01em;font-weight:800;text-transform:none}
tbody tr:hover{background:var(--surface-2)} tbody tr:last-child td{border-bottom:0}.title-cell{min-width:220px}.task-title{font-weight:800;letter-spacing:-.02em}.task-sub{color:var(--muted);font-size:11px;margin-top:4px;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:800;white-space:nowrap;background:var(--surface-2);border:1px solid var(--line)}
.badge.receive{background:var(--primary-soft);color:var(--primary);border-color:transparent}.badge.handover{background:var(--success-soft);color:var(--success);border-color:transparent}.badge.high{background:var(--danger-soft);color:var(--danger);border-color:transparent}.badge.medium{background:var(--warning-soft);color:var(--warning);border-color:transparent}.badge.low{color:var(--muted)}
.status{font-weight:800}.status.done{color:var(--success)}.status.active{color:var(--primary)}.status.plan{color:var(--muted)}
.progress{display:flex;align-items:center;gap:8px;min-width:110px}.bar{height:6px;flex:1;border-radius:999px;background:var(--line);overflow:hidden}.bar span{display:block;height:100%;border-radius:inherit;background:var(--primary)}.pct{font-size:11px;color:var(--muted);width:31px;text-align:right}
.due-soon{color:var(--danger);font-weight:850}.due-chip{display:block;font-size:10px;margin-top:3px;color:var(--danger);font-weight:800}.actions{display:flex;gap:6px}
.empty{padding:58px 22px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:16px;margin-bottom:6px}
.footer-line{padding:12px 16px;color:var(--muted);font-size:11px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.modal-backdrop{position:fixed;inset:0;background:rgba(7,12,24,.52);display:none;place-items:center;padding:18px;z-index:20;backdrop-filter:blur(5px)}.modal-backdrop.open{display:grid}.modal{width:min(780px,100%);max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:19px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}.modal-head h2{font-size:18px;margin:0}.modal-body{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:14px}.modal-body .wide{grid-column:1/-1}.modal-foot{display:flex;justify-content:flex-end;gap:9px;padding:16px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}textarea.control{min-height:92px;resize:vertical}
.toast-wrap{position:fixed;right:20px;bottom:20px;display:grid;gap:9px;z-index:50;max-width:min(420px,calc(100vw - 40px))}.toast{background:var(--surface);color:var(--text);border:1px solid var(--line);box-shadow:var(--shadow);padding:13px 15px;border-radius:13px;font-size:13px;animation:up .2s ease}.toast.error{border-left:4px solid var(--danger)}.toast.success{border-left:4px solid var(--success)}@keyframes up{from{transform:translateY(8px);opacity:0}}
.mobile-list{display:none;padding:10px}.mobile-card{border:1px solid var(--line);border-radius:15px;padding:14px;background:var(--surface);margin-bottom:10px}.mobile-card .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.mobile-card h3{font-size:15px;margin:8px 0 5px}.mobile-card p{font-size:12px;color:var(--muted);margin:0;line-height:1.5}.mobile-card .meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.mobile-card .meta div{background:var(--surface-2);padding:9px;border-radius:10px;font-size:11px}.mobile-card .meta b{display:block;font-size:10px;color:var(--muted);margin-bottom:4px}.mobile-card .card-actions{display:flex;gap:7px;margin-top:12px}
.file-input{display:none}.test-results{display:none;margin:12px 0;padding:12px;border:1px solid var(--line);background:var(--surface);border-radius:12px;font-size:12px;white-space:pre-wrap}
@media(max-width:1080px){.grid-cards{grid-template-columns:repeat(3,1fr)}.toolbar{grid-template-columns:1fr 1fr 1fr}.toolbar .search-field{grid-column:1/-1}.toolbar .reset-wrap{align-self:end}}
@media(max-width:700px){.app{padding:18px 12px 28px}.header{align-items:flex-start}.brand p{display:none}.brand h1{font-size:20px}.header-actions .btn span.label{display:none}.grid-cards{grid-template-columns:1fr 1fr;gap:9px}.metric{padding:14px;min-height:92px}.metric .value{font-size:24px}.toolbar{grid-template-columns:1fr 1fr;padding:12px}.toolbar .search-field{grid-column:1/-1}.toolbar .reset-wrap{grid-column:1/-1}.table-wrap{display:none}.mobile-list{display:block}.panel{border-radius:17px}.modal-body{grid-template-columns:1fr}.modal-body .wide{grid-column:1}.modal{border-radius:18px}.footer-line{font-size:10px}.header-actions{gap:6px}.btn{padding:9px 10px}.grid-cards .metric:nth-child(5){grid-column:1/-1}}
@media(max-width:430px){.grid-cards{grid-template-columns:1fr 1fr}.metric .hint{display:none}.toolbar{grid-template-columns:1fr}.toolbar .search-field,.toolbar .reset-wrap{grid-column:1}.header{flex-direction:column}.header-actions{width:100%;justify-content:flex-start}.header-actions .btn{flex:1}.header-actions .btn.primary{flex:1.25}.mobile-card .meta{grid-template-columns:1fr 1fr}}

.status-select{min-width:96px;padding:7px 28px 7px 9px;min-height:34px;font-size:12px;font-weight:800;border-radius:9px}
.check-summary{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:11px;color:var(--muted)}
.check-mini{height:5px;width:74px;border-radius:999px;background:var(--line);overflow:hidden}.check-mini span{display:block;height:100%;background:var(--success);border-radius:inherit}
.view-note{font-size:11px;color:var(--muted);margin-top:3px}.archived-row{opacity:.9}.trash-row{opacity:.72}
.modal.compact{width:min(650px,100%)}.modal.wide-modal{width:min(980px,100%)}
.checklist-list{display:grid;gap:9px}.check-item{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}.check-item input{margin-top:2px;width:18px;height:18px;accent-color:var(--primary)}.check-item.done span{text-decoration:line-through;color:var(--muted)}
.checklist-headline{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.checklist-headline strong{font-size:14px}.checklist-headline span{font-size:12px;color:var(--muted)}
.preview-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.preview-stat{padding:12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}.preview-stat b{display:block;font-size:20px;margin-top:4px}.preview-stat span{font-size:11px;color:var(--muted)}
.preview-table-wrap{max-height:48vh;overflow:auto;border:1px solid var(--line);border-radius:12px}.preview-table{min-width:720px}.preview-table th{position:sticky;top:0}.preview-table td,.preview-table th{padding:10px}.preview-dup{color:var(--warning);font-weight:800}.preview-new{color:var(--success);font-weight:800}
.toast-row{display:flex;align-items:center;gap:12px;justify-content:space-between}.toast-action{border:0;background:var(--primary-soft);color:var(--primary);font-weight:850;padding:6px 9px;border-radius:8px;white-space:nowrap}
.metric{cursor:default}.metric[data-metric]{cursor:pointer}.metric[data-metric]:focus-visible{outline:3px solid rgba(56,89,217,.22);outline-offset:2px}
.backup-input{display:none}.toolbar .field.sort-field,.toolbar .field.view-field{min-width:130px}
@media(max-width:1080px){.toolbar .sort-field,.toolbar .view-field{grid-column:auto}.header-actions{max-width:680px}}
@media(max-width:700px){.status-select{min-width:0;width:100%}.preview-summary{grid-template-columns:1fr 1fr 1fr}.preview-stat{padding:9px}.preview-stat b{font-size:17px}.check-summary{margin-top:5px}}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand"><div class="logo">업</div><div><h1>업무터치</h1><p>업무 인수·인계를 한 화면에서 빠르게 관리하세요.</p></div></div>
    <div class="header-actions">
      <button class="btn" id="themeBtn" title="다크모드 전환">◐ <span class="label">다크모드</span></button>
      <button class="btn" id="templateBtn" title="표준 엑셀 양식 다운로드">⇩ <span class="label">엑셀 양식</span></button>
      <button class="btn" id="uploadBtn" title="엑셀 업로드">⇧ <span class="label">엑셀 업로드</span></button>
      <input class="file-input" type="file" id="fileInput" accept=".xlsx" />
      <button class="btn" id="exportBtn" title="현재 목록 엑셀 저장">▦ <span class="label">엑셀 저장</span></button>
      <button class="btn secondary-data" id="backupBtn" title="업무터치 전체 데이터 백업">⬇ <span class="label">백업</span></button>
      <button class="btn secondary-data" id="restoreBtn" title="업무터치 백업파일 복원">⬆ <span class="label">복원</span></button>
      <input class="backup-input" type="file" id="restoreFileInput" accept=".json,application/json" />
      <button class="btn primary" id="addBtn">＋ <span>업무 등록</span></button>
    </div>
  </header>

  <section class="grid-cards" aria-label="업무 현황">
    <div class="metric" data-metric="all" tabindex="0"><div class="label">전체 업무</div><div class="value" id="mTotal">0</div><div class="hint">현재 관리 중인 업무</div></div>
    <div class="metric" data-metric="receive" tabindex="0"><div class="label">인수 업무</div><div class="value" id="mReceive">0</div><div class="hint">내가 인수받은 업무</div></div>
    <div class="metric" data-metric="handover" tabindex="0"><div class="label">인계 업무</div><div class="value" id="mHandover">0</div><div class="hint">다른 사람에게 인계할 업무</div></div>
    <div class="metric" data-metric="soon" tabindex="0"><div class="label">마감 임박</div><div class="value" id="mSoon">0</div><div class="hint">3일 이내 · 미완료</div></div>
    <div class="metric" data-metric="important" tabindex="0"><div class="label">중요 업무</div><div class="value" id="mImportant">0</div><div class="hint">중요도 '높음' 업무</div></div>
  </section>

  <div id="testResults" class="test-results"></div>

  <section class="panel">
    <div class="toolbar">
      <div class="field search-field"><label>업무명 검색</label><div class="search-wrap"><span class="search-icon">⌕</span><input class="control" id="searchInput" placeholder="업무명을 입력하세요" /></div></div>
      <div class="field"><label>인수 / 인계</label><select class="control" id="directionFilter"><option value="">전체</option><option>인수</option><option>인계</option></select></div>
      <div class="field"><label>진행상태</label><select class="control" id="statusFilter"><option value="">전체</option><option>예정</option><option>진행중</option><option>완료</option></select></div>
      <div class="field"><label>중요도</label><select class="control" id="priorityFilter"><option value="">전체</option><option>높음</option><option>보통</option><option>낮음</option></select></div>
      <div class="field view-field"><label>보기</label><select class="control" id="viewFilter"><option value="active">관리 중</option><option value="archive">보관함</option><option value="trash">휴지통</option></select></div>
      <div class="field sort-field"><label>정렬</label><select class="control" id="sortFilter"><option value="due">마감 가까운 순</option><option value="updated">최근 수정 순</option><option value="priority">중요도 순</option><option value="progress">완료율 높은 순</option><option value="title">업무명 순</option></select></div>
      <div class="reset-wrap"><button class="btn ghost" id="resetFilterBtn">필터 초기화</button></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>업무명</th><th>구분</th><th>처리기한</th><th>진행상태</th><th>중요도</th><th>완료율</th><th>참고사항</th><th>관리</th></tr></thead>
        <tbody id="taskBody"></tbody>
      </table>
      <div class="empty" id="emptyState" style="display:none"><strong>표시할 업무가 없습니다.</strong>검색어나 필터를 바꾸거나 새 업무를 등록해 주세요.</div>
    </div>
    <div class="mobile-list" id="mobileList"></div>
    <div class="footer-line"><span id="resultCount">0개 업무 표시 중</span><span>데이터는 이 브라우저에만 저장됩니다.</span></div>
  </section>
</div>

<div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <div class="modal-head"><h2 id="modalTitle">업무 등록</h2><button class="btn ghost small" id="closeModalBtn">닫기</button></div>
    <form id="taskForm">
      <input type="hidden" id="taskId" />
      <div class="modal-body">
        <div class="field wide"><label>업무명 *</label><input class="control" id="fTitle" required maxlength="120" placeholder="예: 월간 실적보고 자료 취합" /></div>
        <div class="field"><label>인수 / 인계 *</label><select class="control" id="fDirection" required><option>인수</option><option>인계</option></select></div>
        <div class="field"><label>카테고리</label><input class="control" id="fCategory" maxlength="80" placeholder="예: 정기/반복업무" /></div>
        <div class="field"><label>인수인계 대상자</label><input class="control" id="fCounterpart" maxlength="80" placeholder="예: 홍길동 주임" /></div>
        <div class="field"><label>소속 부서/직급</label><input class="control" id="fDepartmentRole" maxlength="120" placeholder="예: 행정지원과 / 주무관" /></div>
        <div class="field"><label>연락처/이메일</label><input class="control" id="fContact" maxlength="160" placeholder="예: 02-000-0000 / user@example.com" /></div>
        <div class="field"><label>처리기한 *</label><input class="control" id="fDueDate" type="date" required /></div>
        <div class="field"><label>진행상태 *</label><select class="control" id="fStatus"><option>예정</option><option>진행중</option><option>완료</option></select></div>
        <div class="field"><label>중요도 *</label><select class="control" id="fPriority"><option>높음</option><option selected>보통</option><option>낮음</option></select></div>
        <div class="field wide"><label>완료율 <span id="progressValue">0%</span></label><input id="fProgress" type="range" min="0" max="100" step="5" value="0" /></div>
        <div class="field wide"><label>업무내용</label><textarea class="control" id="fContent" maxlength="4000" placeholder="업무 상세 내용과 주의사항을 적어 주세요."></textarea></div>
        <div class="field wide"><label>세부 체크리스트</label><textarea class="control" id="fChecklist" maxlength="3000" placeholder="쉼표 또는 줄바꿈으로 구분해 입력하세요."></textarea></div>
        <div class="field wide"><label>관련 문서/드라이브 링크</label><textarea class="control" id="fDocuments" maxlength="3000" placeholder="관련 파일명, 문서 위치 또는 링크를 입력하세요."></textarea></div>
        <div class="field wide"><label>참고사항</label><textarea class="control" id="fNotes" maxlength="3000" placeholder="후속조치, 별도 메모 등 추가 참고사항을 적어 주세요."></textarea></div>
      </div>
      <div class="modal-foot"><button type="button" class="btn" id="cancelBtn">취소</button><button type="submit" class="btn primary">저장</button></div>
    </form>
  </div>
</div>

<div class="modal-backdrop" id="checklistBackdrop" role="dialog" aria-modal="true" aria-labelledby="checklistTitle">
  <div class="modal compact">

function zipStore(files){let offset=0,locals=[],centrals=[];for(const [name,content] of Object.entries(files)){const nameB=te.encode(name),data=typeof content==='string'?te.encode(content):content,crc=crc32(data);const l=new Uint8Array(30+nameB.length);u32(l,0,0x04034b50);u16(l,4,20);u16(l,6,0);u16(l,8,0);u16(l,10,0);u16(l,12,0);u32(l,14,crc);u32(l,18,data.length);u32(l,22,data.length);u16(l,26,nameB.length);u16(l,28,0);l.set(nameB,30);locals.push(l,data);const c=new Uint8Array(46+nameB.length);u32(c,0,0x02014b50);u16(c,4,20);u16(c,6,20);u16(c,8,0);u16(c,10,0);u16(c,12,0);u16(c,14,0);u32(c,16,crc);u32(c,20,data.length);u32(c,24,data.length);u16(c,28,nameB.length);u16(c,30,0);u16(c,32,0);u16(c,34,0);u16(c,36,0);u32(c,38,0);u32(c,42,offset);c.set(nameB,46);centrals.push(c);offset+=l.length+data.length}const central=concat(centrals),local=concat(locals),e=new Uint8Array(22);u32(e,0,0x06054b50);u16(e,4,0);u16(e,6,0);u16(e,8,centrals.length);u16(e,10,centrals.length);u32(e,12,central.length);u32(e,16,local.length);u16(e,20,0);return concat([local,central,e])}
function xmlEsc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]))}

function workbookBytes(rows,sheetName='인수인계작성양식'){

 const files={
  '[Content_Types].xml':`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`,
  '_rels/.rels':`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`,
  'xl/workbook.xml':`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${xmlEsc(sheetName)}" sheetId="1" r:id="rId1"/></sheets></workbook>`,
  'xl/_rels/workbook.xml.rels':`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`,
  'xl/styles.xml':`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="1"><font><sz val="11"/><name val="맑은 고딕"/></font></fonts><fills count="1"><fill><patternFill patternType="none"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`,
  'xl/worksheets/sheet1.xml':`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><dimension ref="A1:${lastCol}${Math.max(1,rows.length)}"/><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols><col min="1" max="1" width="10" customWidth="1"/><col min="2" max="2" width="34" customWidth="1"/><col min="3" max="3" width="18" customWidth="1"/><col min="4" max="4" width="20" customWidth="1"/><col min="5" max="6" width="22" customWidth="1"/><col min="7" max="8" width="16" customWidth="1"/><col min="9" max="9" width="15" customWidth="1"/><col min="10" max="10" width="44" customWidth="1"/><col min="11" max="11" width="42" customWidth="1"/><col min="12" max="12" width="38" customWidth="1"/></cols><sheetData>${rowXml}</sheetData></worksheet>`
 };
 return zipStore(files);
}
function downloadBlob(bytes,name){const blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500)}
function bytesFromBase64(s){const bin=atob(s),out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out}
function excelPriority(v){return v==='높음'?'긴급/중요':v==='낮음'?'낮음':'보통'}
function excelStatus(v){return v==='예정'?'인수/인계 대기':v}
function mergeDetailForExcel(t){return [t.content,t.notes?`[참고사항]\n${t.notes}`:''].filter(Boolean).join('\n\n')}
function exportRows(taskList){return [STANDARD_HEADERS,...taskList.map(t=>[t.direction,t.title,t.category||'',t.counterpart||'',t.departmentRole||'',t.contact||'',excelPriority(t.priority),excelStatus(t.status),t.dueDate,mergeDetailForExcel(t),t.checklist||'',t.documents||''])];}
function downloadTemplate(){const sample=[STANDARD_HEADERS,['인수','예: 사례 그룹웨어 전자결재 관리자 권한 이관','시스템/계정권한','홍길동 차장','경영지원팀 / 차장','gdhong@company.com','긴급/중요','진행중','2026-09-30','결재 문서 템플릿 수정 방법 및 관리자 OTP 전달','마스터 계정 로그인 확인, 비상 관리자 지정, 양식 백업','https://company.drive.com/manual']];downloadBlob(workbookBytes(sample),'업무터치_인수인계_엑셀등록양식.xlsx');toast('표준 12열 엑셀 등록양식을 내려받았습니다.');}
function exportCurrent(){const list=activeTasks();downloadBlob(workbookBytes(exportRows(list)),'업무터치_업무목록_'+localDate()+'.xlsx');toast(`관리 중 업무 ${list.length}건을 표준 양식으로 엑셀 저장했습니다.`);}

const $=s=>document.querySelector(s);
const els={
 body:$('#taskBody'),mobile:$('#mobileList'),empty:$('#emptyState'),count:$('#resultCount'),
 search:$('#searchInput'),direction:$('#directionFilter'),status:$('#statusFilter'),priority:$('#priorityFilter'),view:$('#viewFilter'),sort:$('#sortFilter'),
 modal:$('#modalBackdrop'),form:$('#taskForm'),id:$('#taskId'),title:$('#fTitle'),dir:$('#fDirection'),category:$('#fCategory'),counterpart:$('#fCounterpart'),departmentRole:$('#fDepartmentRole'),contact:$('#fContact'),due:$('#fDueDate'),
 fstatus:$('#fStatus'),fpriority:$('#fPriority'),progress:$('#fProgress'),progressValue:$('#progressValue'),content:$('#fContent'),checklist:$('#fChecklist'),documents:$('#fDocuments'),notes:$('#fNotes'),
 checklistModal:$('#checklistBackdrop'),checklistContent:$('#checklistContent'),importModal:$('#importBackdrop'),importContent:$('#importPreviewContent'),
 file:$('#fileInput'),restoreFile:$('#restoreFileInput'),tests:$('#testResults')
};
let tasks=[];
let currentChecklistTaskId=null;
let pendingImport=[];
let metricMode='';
const pad=n=>String(n).padStart(2,'0');
const localDate=(offset=0)=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+offset);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const sampleTasks=()=>[
 {id:uid(),title:'월간 주요업무 실적보고',direction:'인수',dueDate:localDate(2),status:'진행중',priority:'높음',progress:60,content:'부서별 주요업무 추진실적을 취합하고 보고자료를 작성합니다.',checklist:'부서별 자료 요청\n미제출 부서 재요청\n수합자료 검토\n최종 보고자료 작성',notes:'전월 보고자료 형식 참고',createdAt:Date.now(),updatedAt:Date.now()},
 {id:uid(),title:'정기 인사자료 업데이트',direction:'인수',dueDate:localDate(8),status:'예정',priority:'보통',progress:20,content:'인사 변동사항을 확인하여 관리자료를 최신화합니다.',notes:'변동자 명단 재확인',createdAt:Date.now(),updatedAt:Date.now()},
 {id:uid(),title:'행사 운영 매뉴얼 인계',direction:'인계',dueDate:localDate(5),status:'진행중',priority:'보통',progress:75,content:'행사 사전 준비부터 현장 운영까지 필요한 체크사항을 정리해 인계합니다.',checklist:'행사계획 확인\n참석자 명단 점검\n현장 준비사항 인계\n결과보고 위치 안내',notes:'체크리스트 포함',createdAt:Date.now(),updatedAt:Date.now()},
 {id:uid(),title:'문서 보관함 정리',direction:'인계',dueDate:localDate(-1),status:'완료',priority:'낮음',progress:100,content:'공유폴더와 종이문서 보관 위치를 정리하여 인계합니다.',notes:'완료 문서 목록 첨부',createdAt:Date.now(),updatedAt:Date.now()}
];
function uid(){return (crypto.randomUUID?crypto.randomUUID():'t-'+Date.now()+'-'+Math.random().toString(16).slice(2));}
function parseChecklistText(v){return String(v||'').split(/\r?\n|,/).map(x=>x.trim()).filter(Boolean)}
function reconcileChecklist(text,existing=[]){const old=new Map((Array.isArray(existing)?existing:[]).map(x=>[String(x.text||'').trim(),!!x.done]));return parseChecklistText(text).map(x=>({text:x,done:old.get(x)||false}))}
function purgeExpiredTrash(){const now=Date.now();tasks=tasks.filter(t=>!t.deletedAt||(now-Number(t.deletedAt))<TRASH_RETENTION_MS)}
function load(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const parsed=JSON.parse(raw);if(!Array.isArray(parsed))throw new Error('invalid');tasks=parsed.map(t=>normalizeTask(t,false));purgeExpiredTrash();save();}else{tasks=sampleTasks().map(t=>normalizeTask(t,false));save();}const ui=JSON.parse(localStorage.getItem(UI_KEY)||'{}');if(ui.view&&els.view)els.view.value=ui.view;if(ui.sort&&els.sort)els.sort.value=ui.sort;}catch{tasks=sampleTasks().map(t=>normalizeTask(t,false));save();}}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(tasks));localStorage.setItem(UI_KEY,JSON.stringify({view:els.view?.value||'active',sort:els.sort?.value||'due'}));}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function daysUntil(dateStr){const today=new Date();today.setHours(0,0,0,0);const d=new Date(dateStr+'T00:00:00');return Math.round((d-today)/86400000)}
function isSoon(t){const d=daysUntil(t.dueDate);return !t.deletedAt&&!t.archivedAt&&t.status!=='완료'&&d>=0&&d<=3}
function dueLabel(t){const d=daysUntil(t.dueDate);if(t.status==='완료')return '';if(d<0)return `기한 ${Math.abs(d)}일 지남`;if(d===0)return '오늘 마감';if(d<=3)return `${d}일 남음`;return ''}
function normalizeTask(t,touch=true){
 const progress=Math.max(0,Math.min(100,Number(t.progress)||0));const status=['예정','진행중','완료'].includes(t.status)?t.status:'예정';const checklist=String(t.checklist||'');
 return {id:t.id||uid(),title:String(t.title||'').trim(),direction:['인수','인계'].includes(t.direction)?t.direction:'인수',category:String(t.category||'').trim(),counterpart:String(t.counterpart||'').trim(),departmentRole:String(t.departmentRole||'').trim(),contact:String(t.contact||'').trim(),dueDate:String(t.dueDate||localDate()),status,priority:['높음','보통','낮음'].includes(t.priority)?t.priority:'보통',progress:status==='완료'?100:progress,previousProgress:Number.isFinite(Number(t.previousProgress))?Number(t.previousProgress):progress,content:String(t.content||''),checklist,checklistItems:reconcileChecklist(checklist,t.checklistItems),documents:String(t.documents||''),notes:String(t.notes||''),archivedAt:t.archivedAt||null,deletedAt:t.deletedAt||null,createdAt:t.createdAt||Date.now(),updatedAt:touch?Date.now():(t.updatedAt||Date.now())};
}
function activeTasks(){return tasks.filter(t=>!t.deletedAt&&!t.archivedAt)}
function checklistStats(t){const items=Array.isArray(t.checklistItems)?t.checklistItems:[];const done=items.filter(x=>x.done).length;return {done,total:items.length,pct:items.length?Math.round(done/items.length*100):0}}
function priorityRank(p){return p==='높음'?0:p==='보통'?1:2}
function sortTasks(list){const mode=els.sort?.value||'due';return list.sort((a,b)=>{if(mode==='updated')return Number(b.updatedAt)-Number(a.updatedAt);if(mode==='priority')return priorityRank(a.priority)-priorityRank(b.priority)||a.dueDate.localeCompare(b.dueDate);if(mode==='progress')return b.progress-a.progress||a.dueDate.localeCompare(b.dueDate);if(mode==='title')return a.title.localeCompare(b.title,'ko');const ac=a.status==='완료'?1:0,bc=b.status==='완료'?1:0;return ac-bc||a.dueDate.localeCompare(b.dueDate)||Number(b.updatedAt)-Number(a.updatedAt)})}
function filtered(){const q=els.search.value.trim().toLowerCase(),view=els.view?.value||'active';let list=tasks.filter(t=>view==='trash'?!!t.deletedAt:view==='archive'?!t.deletedAt&&!!t.archivedAt:!t.deletedAt&&!t.archivedAt);list=list.filter(t=>(!q||[t.title,t.content,t.notes,t.counterpart,t.category].some(v=>String(v||'').toLowerCase().includes(q)))&&(!els.direction.value||t.direction===els.direction.value)&&(!els.status.value||t.status===els.status.value)&&(!els.priority.value||t.priority===els.priority.value));if(metricMode==='soon')list=list.filter(isSoon);else if(metricMode==='important')list=list.filter(t=>t.priority==='높음');return sortTasks(list)}

function render(){

  const row=rows[r];if(!row||row.every(v=>String(v??'').trim()===''))continue;
  const title=valueAt(row,col.title),direction=valueAt(row,col.direction),due=excelDateToIso(valueAt(row,col.due)),rawStatus=valueAt(row,col.status),rawPriority=valueAt(row,col.priority);
  const rowErr=[];if(!title)rowErr.push('업무명');if(!['인수','인계'].includes(direction))rowErr.push('구분(인수 또는 인계)');if(!/^\d{4}-\d{2}-\d{2}$/.test(due))rowErr.push('마감기한(YYYY-MM-DD)');
  if(rowErr.length){errors.push(`${r+1}행: ${rowErr.join(', ')}`);continue}
  const detail=splitDetailNotes(valueAt(row,col.content));let notes=[detail.notes,valueAt(row,col.notes)].filter(Boolean);
  const sourceStatus=rawStatus&&!['예정','진행중','완료','대기','인수/인계 대기'].includes(rawStatus)?rawStatus:'';
  if(sourceStatus)notes.push(`원본 진행상태: ${sourceStatus}`);
  const start=valueAt(row,col.start),related=valueAt(row,col.related),followup=valueAt(row,col.followup),caution=valueAt(row,col.caution),handoverFrom=valueAt(row,col.handoverFrom),handoverTo=valueAt(row,col.handoverTo),owner=valueAt(row,col.owner);
  if(start)notes.push(`시작일: ${excelDateToIso(start)}`);if(related)notes.push(`관련기관·대상: ${related}`);if(followup)notes.push(`후속조치: ${followup}`);if(caution)notes.push(`주의사항: ${caution}`);
  if(handoverFrom)notes.push(`인계자: ${handoverFrom}`);if(handoverTo)notes.push(`인수자: ${handoverTo}`);if(owner)notes.push(`담당자: ${owner}`);
  let counterpart=valueAt(row,col.counterpart);
  if(!counterpart)counterpart=direction==='인계'?valueAt(row,col.handoverTo):valueAt(row,col.handoverFrom);
  const rawProgress=valueAt(row,col.progress);let progress=rawProgress===''?NaN:Number(rawProgress.replace('%',''));const status=normalizeStatusValue(rawStatus);
  if(!Number.isFinite(progress)||progress<0||progress>100)progress=status==='완료'?100:status==='진행중'?50:0;
  let priority=normalizePriorityValue(rawPriority);if(rawStatus==='긴급')priority='높음';
  out.push(normalizeTask({title,direction,category:valueAt(row,col.category),counterpart,departmentRole:valueAt(row,col.departmentRole),contact:valueAt(row,col.contact),dueDate:due,status,priority,progress,content:detail.content,checklist:valueAt(row,col.checklist),documents:valueAt(row,col.documents),notes:notes.join('\n')}));
 }
 if(errors.length)throw new Error(`업로드할 수 없는 값이 있습니다.\n${errors.slice(0,6).join('\n')}${errors.length>6?`\n외 ${errors.length-6}건`:''}`);
 if(!out.length)throw new Error('업로드할 업무 데이터가 없습니다.');
 return out;
}
async function uploadFile(file){if(!file)return;if(!/\.xlsx$/i.test(file.name)){toast('엑셀 .xlsx 파일만 업로드할 수 있습니다.','error',5000);els.file.value='';return}try{const rows=await parseXlsx(await file.arrayBuffer()),imported=rowsToTasks(rows);showImportPreview(imported)}catch(err){toast('엑셀 업로드 실패: '+err.message,'error',7000);els.file.value=''}}

 [els.search,els.direction,els.status,els.priority].forEach(el=>el.addEventListener(el.tagName==='INPUT'?'input':'change',()=>{metricMode='';render()}));els.view.addEventListener('change',()=>{metricMode='';render()});els.sort.addEventListener('change',render);$('#resetFilterBtn').addEventListener('click',()=>{els.search.value='';els.direction.value='';els.status.value='';els.priority.value='';els.view.value='active';els.sort.value='due';metricMode='';render()});

 $('#closeImportBtn').addEventListener('click',closeImport);$('#cancelImportBtn').addEventListener('click',closeImport);els.importModal.addEventListener('click',e=>{if(e.target===els.importModal)closeImport()});$('#importSkipBtn').addEventListener('click',()=>commitImport('skip'));$('#importAllBtn').addEventListener('click',()=>commitImport('all'));$('#importReplaceBtn').addEventListener('click',()=>commitImport('replace'));

async function runSelfTests(){const lines=[];const ok=(name,cond)=>{lines.push(`${cond?'PASS':'FAIL'} · ${name}`);if(!cond)throw new Error(name)};try{const original=JSON.parse(JSON.stringify(tasks));const ui={view:els.view.value,sort:els.sort.value};const test=normalizeTask({title:'v1.2 테스트 업무',direction:'인계',counterpart:'테스트 담당',dueDate:localDate(1),status:'진행중',priority:'높음',progress:55,content:'테스트',checklist:'첫 단계\n둘째 단계',notes:'테스트'});tasks=[...original,test];save();ok('기존 저장키 호환/업무 등록',JSON.parse(localStorage.getItem(STORAGE_KEY)).some(t=>t.title==='v1.2 테스트 업무'));ok('체크리스트 구조 변환',test.checklistItems.length===2&&!test.checklistItems[0].done);test.checklistItems[0].done=true;save();ok('체크리스트 체크 저장',JSON.parse(localStorage.getItem(STORAGE_KEY)).find(t=>t.id===test.id).checklistItems[0].done===true);const oldProgress=test.progress;setTaskStatus(test.id,'완료');ok('목록 상태 빠른 변경',tasks.find(t=>t.id===test.id).status==='완료'&&tasks.find(t=>t.id===test.id).progress===100);setTaskStatus(test.id,'진행중');ok('완료 해제 시 완료율 복원',tasks.find(t=>t.id===test.id).progress===oldProgress);archiveTask(test.id);ok('완료 업무 보관',!!tasks.find(t=>t.id===test.id).archivedAt);restoreArchive(test.id);ok('보관 해제',!tasks.find(t=>t.id===test.id).archivedAt);const t=tasks.find(x=>x.id===test.id);t.deletedAt=Date.now();ok('휴지통 이동 데이터 구조',!!t.deletedAt);restoreTrash(test.id);ok('휴지통 복원',!tasks.find(x=>x.id===test.id).deletedAt);const dup=normalizeTask({...test,id:undefined});ok('엑셀 중복 판정 키',duplicateSignature(dup)===duplicateSignature(test)&&!!findDuplicate(dup));els.view.value='active';els.sort.value='priority';ok('중요도 정렬',sortTasks([normalizeTask({...test,title:'낮음',priority:'낮음'}),normalizeTask({...test,title:'높음',priority:'높음'})])[0].priority==='높음');const backup={app:'업무터치',version:APP_VERSION,tasks};ok('백업 데이터 구조',backup.app==='업무터치'&&Array.isArray(backup.tasks));const bytes=workbookBytes(exportRows([test]));ok('엑셀 저장 생성',bytes.length>1000);const parsed=await parseXlsx(bytes.buffer);ok('엑셀 파서/재업로드',parsed[0][0]==='구분'&&rowsToTasks(parsed).length===1);ok('마감 임박 판정',isSoon(test)===true);ok('모바일 반응형 CSS','matchMedia' in window);tasks=original;els.view.value=ui.view;els.sort.value=ui.sort;save();render();lines.push('\n전체 v1.2 핵심 기능 테스트 통과');}catch(e){lines.push(`\n테스트 중단: ${e.message}`)}finally{els.search.value='';els.direction.value='';els.status.value='';els.priority.value='';metricMode='';els.tests.style.display='block';els.tests.textContent=lines.join('\n');document.body.dataset.testsDone='1';document.body.dataset.testsPassed=lines.some(x=>x.includes('전체 v1.2 핵심 기능 테스트 통과'))?'1':'0'}}
